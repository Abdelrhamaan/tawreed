apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: tawreed
  labels:
    app.kubernetes.io/name: nginx
    app.kubernetes.io/part-of: tawreed
spec:
  replicas: 4
  selector:
    matchLabels:
      app.kubernetes.io/name: nginx
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  progressDeadlineSeconds: 600
  minReadySeconds: 10
  revisionHistoryLimit: 5
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nginx
        app.kubernetes.io/part-of: tawreed
    spec:
      nodeSelector:
        tier: apps
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          # ومش هتخش ع نودز جديدة pending البودز الجديدة هتبقي maxSkew لو نود وقعت بتعتبر فيها صفر بودز فلو الفرق كبير بين النودز عن 1 زي ما في 
          whenUnsatisfiable: DoNotSchedule
          # Ignore nodes that are cordoned (drain) or unreachable (node down).
          # Without this, a dead node still counts as a zone with 0 pods,
          # and replacement pods stay Pending forever.
          # ديه هتخليني محسبش النود الواقعة وبالتالي اقدر احط كل البودز ع النود ديه 
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: nginx
      containers:
        - name: nginx
          image: nginx:1.27.5
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            # nginx writes temp files here (client bodies, proxy buffers).
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: tmp
              mountPath: /tmp
      volumes:
        # emptyDir = empty folder created when the pod starts,
        # deleted when the pod is deleted. Not shared between pods.
        - name: nginx-cache
          emptyDir:
            sizeLimit: 64Mi
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: tawreed
  labels:
    app.kubernetes.io/name: nginx
    app.kubernetes.io/part-of: tawreed
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nginx
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
